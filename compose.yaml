services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: stageflow
      POSTGRES_PASSWORD: stageflow-local-db
      POSTGRES_DB: stageflow
    volumes: [stageflow-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U stageflow -d stageflow]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://stageflow:stageflow-local-db@db:5432/stageflow
      JWT_SECRET: ${STAGEFLOW_JWT_SECRET:?Run node scripts/setup-env.mjs first}
      API_HOST: 0.0.0.0
      SEED_DEMO: 'true'
      COOKIE_SECURE: 'false'
      CORS_ORIGINS: http://127.0.0.1:9148,http://localhost:9148,http://localhost:9150,http://127.0.0.1:9150
    ports: ['127.0.0.1:9149:9149']
    depends_on:
      db: {condition: service_healthy}
  web:
    build: .
    command: [node,node_modules/next/dist/bin/next,start,apps/web,--hostname,0.0.0.0,--port,'9148']
    environment:
      STAGEFLOW_API_URL: http://api:9149
    ports: ['127.0.0.1:9148:9148']
    depends_on: [api]
volumes:
  stageflow-db:
