name: Verify Stageflow
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: stageflow
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: stageflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stageflow -d stageflow"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://stageflow:test-only-password@127.0.0.1:5432/stageflow
      NEXT_TELEMETRY_DISABLED: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --workspaces=false --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx expo export --platform web --output-dir ../../.runtime/web-export
        working-directory: apps/mobile
      - run: npx expo export --platform android --output-dir ../../.runtime/android-export
        working-directory: apps/mobile
